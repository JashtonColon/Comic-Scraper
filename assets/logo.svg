<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b1fd1"/>
      <stop offset="0.55" stop-color="#8a1fd6"/>
      <stop offset="1" stop-color="#e0247a"/>
    </linearGradient>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="22" cy="22" r="9" fill="#ffffff" fill-opacity="0.13"/>
    </pattern>
    <radialGradient id="fade" cx="0.82" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmask"><rect width="1024" height="1024" fill="url(#fade)"/></mask>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe14d"/>
      <stop offset="1" stop-color="#ffb800"/>
    </linearGradient>
    <clipPath id="tile"><rect x="32" y="32" width="960" height="960" rx="210"/></clipPath>
  </defs>

  <!-- tile -->
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#dots)" mask="url(#dotmask)"/>
    <!-- action burst rays -->
    <g fill="#ffffff" fill-opacity="0.08">
      <path d="M512 470 L120 40 L300 40 Z"/>
      <path d="M512 470 L1000 160 L1000 330 Z"/>
      <path d="M512 470 L40 640 L40 800 Z"/>
      <path d="M512 470 L760 1000 L590 1000 Z"/>
    </g>
  </g>

  <!-- speech bubble: hard shadow, then bubble -->
  <g transform="translate(22 26)">
    <path d="M512 170 C 738 170 868 286 868 450 C 868 614 738 730 512 730 C 470 730 430 726 394 718 L 250 836 L 286 690 C 196 640 156 552 156 450 C 156 286 286 170 512 170 Z"
          fill="#14062e"/>
  </g>
  <path d="M512 170 C 738 170 868 286 868 450 C 868 614 738 730 512 730 C 470 730 430 726 394 718 L 250 836 L 286 690 C 196 640 156 552 156 450 C 156 286 286 170 512 170 Z"
        fill="url(#bubble)" stroke="#14062e" stroke-width="30" stroke-linejoin="round"/>
  <!-- shine -->
  <path d="M300 300 C 340 250 400 226 460 220" fill="none" stroke="#fff6c2" stroke-width="26" stroke-linecap="round"/>

  <!-- download arrow (bolt-cut shaft) with tray -->
  <g stroke="#14062e" stroke-width="26" stroke-linejoin="round" stroke-linecap="round">
    <path d="M462 258 L562 258 L562 430 L640 430 L512 580 L384 430 L462 430 Z" fill="#ff3b5c"/>
    <path d="M350 600 L350 650 L674 650 L674 600" fill="none"/>
  </g>
  <!-- little lightning notch on the shaft -->
  <path d="M492 290 L532 290 L512 350 L540 350 L486 420 L500 362 L478 362 Z" fill="#ffffff" fill-opacity="0.85"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
